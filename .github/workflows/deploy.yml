name: Deploy infrastructure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        required: true
        type: choice
        options:
          - dev
          - test

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy-network:
    name: Deploy network
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    defaults:
      run:
        working-directory: stacks/network

    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"

      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"

      TF_VAR_environment: ${{ inputs.environment }}
      TF_VAR_shortname: ${{ vars.SHORTNAME }}
      TF_VAR_project: ${{ vars.PROJECT }}
      TF_VAR_location: ${{ vars.LOCATION }}
      TF_VAR_address_space: ${{ vars.ADDRESS_SPACE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Show Azure identity
        run: az account show

      - name: Terraform init
        run: >
          terraform init
          -backend-config="../../shared/backend.hcl"
          -backend-config="key=${{ inputs.environment }}/network.tfstate"

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -out=tfplan

      - name: Terraform apply
        run: terraform apply tfplan

  deploy-app:
    name: Deploy app
    runs-on: ubuntu-latest
    needs: deploy-network
    environment: ${{ inputs.environment }}

    defaults:
      run:
        working-directory: stacks/app

    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"

      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"

      TF_VAR_environment: ${{ inputs.environment }}
      TF_VAR_shortname: ${{ vars.SHORTNAME }}
      TF_VAR_project: ${{ vars.PROJECT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Load backend values for remote state
        shell: bash
        run: |
          BACKEND_RG=$(grep 'resource_group_name' ../../shared/backend.hcl | cut -d'"' -f2)
          BACKEND_STORAGE=$(grep 'storage_account_name' ../../shared/backend.hcl | cut -d'"' -f2)
          BACKEND_CONTAINER=$(grep 'container_name' ../../shared/backend.hcl | cut -d'"' -f2)

          echo "TF_VAR_backend_resource_group_name=$BACKEND_RG" >> "$GITHUB_ENV"
          echo "TF_VAR_backend_storage_account_name=$BACKEND_STORAGE" >> "$GITHUB_ENV"
          echo "TF_VAR_backend_container_name=$BACKEND_CONTAINER" >> "$GITHUB_ENV"

      - name: Terraform init
        run: >
          terraform init
          -backend-config="../../shared/backend.hcl"
          -backend-config="key=${{ inputs.environment }}/app.tfstate"

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -out=tfplan

      - name: Terraform apply
        run: terraform apply tfplan